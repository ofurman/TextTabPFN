[project]
name = "texttabpfn"
version = "0.1.0"
description = "Text-conditioned thinking rows for TabPFN-2.5 (research experiment)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tabpfn==9.2.0",
    "numpy",
    "huggingface-hub",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/texttabpfn"]
